<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Second Life Uhr</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
}

main {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5%;
    box-sizing: border-box;
    gap: 8%;
}

.row {
    display: grid;
    grid-template-columns: 28% 72%;
    align-items: center;
}

.label {
    color: white;
    font-size: 9vh;
    font-weight: bold;
}

.time {
    color: #00ff88;
    font-family: "Courier New", monospace;
    font-size: 18vh;
    font-weight: bold;
    text-align: right;
    white-space: nowrap;
}
</style>
</head>

<body>

<main>
    <div class="row">
        <div class="label">DE</div>
        <div class="time" id="de">00:00:00</div>
    </div>

    <div class="row">
        <div class="label">SLT</div>
        <div class="time" id="slt">00:00:00</div>
    </div>
</main>

<script>
const de = new Intl.DateTimeFormat("de-DE", {
    timeZone: "Europe/Berlin",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
});

const slt = new Intl.DateTimeFormat("de-DE", {
    timeZone: "America/Los_Angeles",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
});

function updateClock() {
    const now = new Date();

    document.getElementById("de").textContent =
        de.format(now);

    document.getElementById("slt").textContent =
        slt.format(now);
}

updateClock();
setInterval(updateClock, 250);
</script>

</body>
</html>
