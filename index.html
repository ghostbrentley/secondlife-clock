<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Life Uhr</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

.clock {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    padding: 20px;
}

.block {
    width: 100%;
    text-align: center;
}

.label {
    color: white;
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.time {
    color: #00ff88;
    font-family: "Courier New", monospace;
    font-size: 105px;
    line-height: 1;
    font-weight: bold;
    white-space: nowrap;
    text-align: center;
}

.line {
    width: 85%;
    height: 2px;
    background: #444;
}
</style>
</head>

<body>

<div class="clock">

    <div class="block">
        <div class="label">DEUTSCHLAND</div>
        <div class="time" id="de">00:00:00</div>
    </div>

    <div class="line"></div>

    <div class="block">
        <div class="label">SECOND LIFE · SLT</div>
        <div class="time" id="slt">00:00:00</div>
    </div>

</div>

<script>
const germanTime = new Intl.DateTimeFormat("de-DE", {
    timeZone: "Europe/Berlin",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
});

const secondLifeTime = new Intl.DateTimeFormat("de-DE", {
    timeZone: "America/Los_Angeles",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
});

const colors = [
    "#00ff88",
    "#00ffff",
    "#0088ff",
    "#aa55ff",
    "#ff00ff",
    "#ff3366",
    "#ff8800",
    "#ffff00"
];

let colorNumber = 0;

function updateClock() {
    const now = new Date();

    document.getElementById("de").textContent =
        germanTime.format(now);

    document.getElementById("slt").textContent =
        secondLifeTime.format(now);
}

function changeColor() {
    colorNumber++;

    if (colorNumber >= colors.length) {
        colorNumber = 0;
    }

    const color = colors[colorNumber];

    document.getElementById("de").style.color = color;
    document.getElementById("slt").style.color = color;
}

updateClock();

setInterval(updateClock, 250);
setInterval(changeColor, 2000);
</script>

</body>
</html>
