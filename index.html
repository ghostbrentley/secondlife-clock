<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Second Life Uhr</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    .clock {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: center;
        padding: 3vh 4vw;
    }

    .block {
        width: 100%;
        text-align: center;
    }

    .label {
        color: white;
        font-size: 6vh;
        font-weight: bold;
        letter-spacing: 0.08em;
        margin-bottom: 1vh;
        text-shadow: 0 0 8px #000;
    }

    .time {
        font-family: "Courier New", monospace;
        font-size: 15vh;
        line-height: 1;
        font-weight: bold;
        white-space: nowrap;
        text-align: center;

        animation: colorChange 15s linear infinite;

        text-shadow:
            0 0 5px currentColor,
            0 0 12px currentColor,
            0 0 22px currentColor;
    }

    .line {
        width: 80%;
        height: 2px;
        background: #444;
    }

    @keyframes colorChange {
        0%   { color: #00ff88; }
        16%  { color: #00ffff; }
        32%  { color: #0088ff; }
        48%  { color: #aa55ff; }
        64%  { color: #ff3399; }
        80%  { color: #ffcc00; }
        100% { color: #00ff88; }
    }
</style>
</head>

<body>

<div class="clock">

    <div class="block">
        <div class="label">DEUTSCHLAND</div>
        <div class="time" id="de">00:00:00</div>
    </div>

    <div class="line"></div>

    <div class="block">
        <div class="label">SECOND LIFE · SLT</div>
        <div class="time" id="slt">00:00:00</div>
    </div>

</div>

<script>
    const germanTime = new Intl.DateTimeFormat("de-DE", {
        timeZone: "Europe/Berlin",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    });

    const secondLifeTime = new Intl.DateTimeFormat("de-DE", {
        timeZone: "America/Los_Angeles",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    });

    function updateClock() {
        const now = new Date();

        document.getElementById("de").textContent =
            germanTime.format(now);

        document.getElementById("slt").textContent =
            secondLifeTime.format(now);
    }

    updateClock();

    setInterval(updateClock, 250);
</script>

</body>
</html>
